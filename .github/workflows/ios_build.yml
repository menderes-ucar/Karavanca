name: Flutter iOS Build & App Store Upload

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Publish to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Pod Clean and Install
        run: |
          cd ios
          pod cache clean --all
          pod install --repo-update
          cd ..

      # Sadece imzasız ham .ipa dosyasını çıkartıyoruz (Bu adım hatasız geçiyor)
      - name: Build IPA
        run: |
          flutter build ipa --release --no-codesign

      # Ucube komutları bıraktık; resmi ve hatasız çalışan yükleme modülünü çağırıyoruz
      - name: Upload App to TestFlight via Apple Action
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/ipa/*.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-key-content: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}