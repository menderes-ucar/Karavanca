name: Flutter iOS Build & App Store Upload

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Publish to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Pod Clean and Install
        run: |
          cd ios
          pod cache clean --all
          pod install --repo-update
          cd ..

      # 1. Adım: Projeyi arşive çeviriyoruz
      - name: Build Archive
        run: |
          flutter build ipa --release --no-codesign

      # 2. Adım: Arşivi Apple'ın kabul edeceği zip formatına sıkıştırıyoruz
      - name: Compress Archive for Apple Upload
        run: |
          cd build/ios/archive
          xcrun ditto -c -k --keepParent Runner.xcarchive Runner.zip

      # 3. Adım: Apple API anahtarını kullanarak doğrudan TestFlight portalına teslim ediyoruz
      - name: Upload and Authenticate via Notarytool
        run: |
          xcrun notarytool submit build/ios/archive/Runner.zip \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" \
            --wait