name: Flutter iOS Build & App Store Upload

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Publish to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Pod Clean and Install
        run: |
          cd ios
          pod cache clean --all
          pod install --repo-update
          cd ..

      # Fastlane saçmalığını aradan çıkardık, sadece imzasız derleme alıyoruz
      - name: Build IPA
        run: |
          flutter build ipa --release --no-codesign

      # Resmi Apple API anahtarı ile üretilen paketi doğrudan App Store'a fırlatıyoruz
      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/archive/*.xcarchive \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"