workflows:
  ios-workflow:
    name: Karavanca iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - supabase_credentials
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        # Codemagic ortamında otomatik sertifika kullanımı için:
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.karavanis

    scripts:
      - name: Sunucu Temizliği ve İzin Ayarları
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          chmod 777 ios/Runner/GeneratedPluginRegistrant.* || true

      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Reset CocoaPods and Force Generate Registrant
        script: |
          flutter build ios --config-only
          cd ios
          pod cache clean --all
          pod install --repo-update
          cd ..

      - name: Fetch and Use Signing Profiles
        script: |
          # App Store Connect API vasıtasıyla sertifikaları ve Push Notifications tanımlı profili çek
          app-store-connect fetch-signing-files "$bundle_identifier" --type IOS_APP_STORE --create
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # Otomatik imzalama flag'i eklenerek arşiv alma adımı
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Publish to App Store Connect / TestFlight
        script: |
          app-store-connect publish --path $(find build/ios/ipa -name "*.ipa" | head -n 1)

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log