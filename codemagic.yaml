workflows:
  ios-workflow:
    name: Karavanca iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - supabase_credentials
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.karavanis
      flutter: stable
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Sunucu Temizliği ve İzin Ayarları
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          chmod 777 ios/Runner/GeneratedPluginRegistrant.* || true

      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Reset CocoaPods
        script: |
          flutter build ios --config-only
          cd ios
          pod cache clean --all
          pod install --repo-update
          cd ..

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles --warn-only

      - name: Archive with raw xcodebuild
        script: |
          set -o pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            archive \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=QUD4H9837R \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee xcode_archive.log

      - name: Publish to App Store Connect / TestFlight
        script: |
          app-store-connect publish --path $(find build/ios/ipa -name "*.ipa" | head -n 1)

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - xcode_archive.log
