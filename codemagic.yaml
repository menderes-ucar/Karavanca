workflows:
  ios-workflow:
    name: Karavanca iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - supabase_credentials
      # Codemagic ortamında API anahtarını doğrudan bağlama:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.karavanis
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Sunucu Temizliği ve İzin Ayarları
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          chmod 777 ios/Runner/GeneratedPluginRegistrant.* || true

      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Reset CocoaPods
        script: |
          flutter build ios --config-only
          cd ios
          pod cache clean --all
          pod install --repo-update
          cd ..

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project initialize
          xcode-project use-profiles --signing-method app-store

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

      - name: Publish to App Store Connect / TestFlight
        script: |
          app-store-connect publish --path $(find build/ios/ipa -name "*.ipa" | head -n 1)

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log