workflows:
  ios-workflow:
    name: Karavanca iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - supabase_credentials

      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.karavanis

    scripts:
      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - name: Clean and get Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: Show Flutter plugins
        script: |
          echo "========== FLUTTER PLUGINS =========="
          cat .flutter-plugins-dependencies || true
          echo "====================================="

      - name: Install CocoaPods dependencies
        script: |
          cd ios

          rm -rf Pods
          rm -f Podfile.lock

          pod cache clean --all
          pod repo update
          pod install --repo-update --verbose

          echo "========== PODS DIRECTORY =========="
          ls -la Pods || true
          echo "===================================="

          echo "========== PODFILE LOCK =========="
          cat Podfile.lock || true
          echo "=================================="

          cd ..

      - name: Configure code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log