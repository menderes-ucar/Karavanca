workflows:
  ios-workflow:
    name: Karavanca iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - supabase_credentials

      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.karavanis

      flutter: stable
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Clean
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks

      - name: Create .env
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install Pods
        script: |
          flutter build ios --config-only

          cd ios
          pod repo update
          pod install
          cd ..

      - name: Configure Code Signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Show Signing Settings
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -showBuildSettings | egrep "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Check Build Outputs
        script: |
          echo "========== BUILD =========="
          find build -maxdepth 5 -type f

          echo ""
          echo "========== IPA =========="
          find build -name "*.ipa" || true

          echo ""
          echo "========== XCARCHIVE =========="
          find build -name "*.xcarchive" || true

    artifacts:
      - build/**/*.ipa
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log